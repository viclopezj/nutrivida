<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header id="encabezado">
			<h1>Calculadora</h1>
			<p>Una calculador echa con HTML5 y JS</p>

	</header>

    <main id="contenido">
			<section id="calculadora" class="seccion">
				<h2>Realize calculos</h2>
				<input type="text" id="pantalla" value="0" readonly>  
                <br><br>  
                    <button class="button" onclick="agregar('7')">7</button>
                    <button class="button" onclick="agregar('8')">8</button>
                    <button class="button" onclick="agregar('9')">9</button>
                    <button class="button" onclick="limpiar()">C</button>
                <br><br>
                    <button class="button" onclick="agregar('4')">4</button>
                    <button class="button" onclick="agregar('5')">5</button>
                    <button class="button" onclick="agregar('6')">6</button>
                    <button class="button" onclick="suma()">+</button>
                <br><br>    
                    <button class="button" onclick="agregar('1')">1</button>
                    <button class="button" onclick="agregar('2')">2</button>
                    <button class="button" onclick="agregar('3')">3</button>
                    <button class="button" onclick="resta()">-</button>
                <br><br>
                    <button class="button" onclick="agregar('0')">0</button>
                    <button class="button" onclick="multiplicacion()">*</button>
                    <button class="button" onclick="division()">/</button>
                    <button class="button" onclick="calcular()">=</button>
                
                    <script src="JS/calculo.js"></script> 
            </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header id="encabezado">
			<h1>Contacto</h1>
			<p>Un formulario echo con HTML5 y JS</p>

	</header>

    <form id ="contacto">
        <fieldset> <!-- fieldset para agrupar en formulario-->
            <legend>Formulario de Contacto</legend>

        <label>Nombre: </label> <!-- Label para definir titulo o elemento-->
        <input type="text"
            name="nombre"
            id="nombre"
            placeholder="Ingrese su nombre" 
            required>
            <!-- placehoder: Un texto que sirve como guia
                 required: Hace necesario escribir algo -->
    
    <br></br>
        <label>Rut: </label>
        <input type="text"
            name=="rut"
            id="rut"
            placeholder="Formtato 22123456-7"
            required>

    <br></br>
        <label>Correo Electronico: </label>
        <input type="email"
            name=="correo"
            id="correo"
            required>

    <br></br>
        <label>Telefono: </label>
        <input type="tel"
            name=="telefono"
            id="telefono">

    <br></br>
        <label>Fecha de Nacimiento: </label>
        <input type="date"
            name=="fenac"
            id="fenac">

    <br></br>
        <label>Productos: </label>
        <select name="productos" id="productos">
            <option value="">-- SELECCIONE UN PRODUCTO --</option> <!-- Cambiar a la tematica de tienda de mineria -->
            <option value="10">Popcorn</option>
            <option value="20">Chocolate</option>
            <option value="30">Chiqule</option>
            <option value="40">Bombones</option>
            <option value="50">Bebidas</option>
        </select>

    <br></br>
        <label>Cantidad: </label>
        <input type="number"
            name="cantidad"
            id="cantidad"
            min="10"
            max="99"
            value="10">

    <br></br>
        <label>Forma de pago: </label>
        <br><br>
        <label>Debito: </label>
        <input type="radio" name="fdepago" value="debito">
        <label>Credito: </label>
        <input type="radio" name="fdepago" value="credito">
        <label>Efectivo: </label>
        <input type="radio" name="fdepago" value="efectivo">
    
    <br></br>
        <button type="submit">ENVIAR</button>
        </fieldset>
    </form>
    <script = src="JS/validaform.js"></script>
</body>
</html>

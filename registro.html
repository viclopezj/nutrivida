<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header id="encabezado">
			<h1>Registro</h1>
			<p>Un formulario echo con HTML5 y JS</p>

	</header>

    <main id ="contenido">
        <form id ="registro">
            <fieldset> <!-- fieldset para agrupar en formulario-->
                <legend>Formulario de Registro</legend>

            <label>Nombre: </label> <!-- Label para definir titulo o elemento-->
            <input class="form" type="text"
                name="nombre"
                id="nombre"
                placeholder="Ingrese su nombre" 
                required>
                <!-- placehoder: Un texto que sirve como guia
                    required: Hace necesario escribir algo -->
        
        <br></br>
            <label>Rut: </label>
            <input class="form" type="text"
                name=="rut"
                id="rut"
                placeholder="Formato 22123456-7"
                required>

        <br></br>
            <label>Correo Electronico: </label>
            <input class="form" type="email"
                name=="correo"
                id="correo"
                placeholder="usuario@gmail.com"
                required>

        <br></br>
            <label>Telefono: </label>
            <input class="form" type="tel"
                name=="telefono"
                id="telefono"
                value="+56">

        <br></br>
            <label>Fecha de Nacimiento: </label>
            <input class="form" type="date"
                name=="fenac"
                id="fenac"
                required>

        <br></br>
            <label>Productos: </label>
            <select name="productos" id="productos" class="producto">
                <option class="producto" value="">-- SELECCIONE UN PRODUCTO --</option> <!-- Cambiar a la tematica de tienda de mineria -->
                <option class="producto" value="10">Casco de Seguridad Industrial con Barboquejo</option>
                <option class="producto" value="20">Botas de Seguridad Dielectricas con Punta de Acero</option>
                <option class="producto" value="30">Guantes Anti-impacto y Corte Nivel 5</option>
                <option class="producto" value="40">Overol de Trabajo Altamente Reflectivo</option>
                <option class="producto" value="50">Arnés de Seguridad Anti-caídas de 4 Puntos</option>
            </select>

        <br></br>
            <label>Cantidad: </label>
            <input class="cantidad" type="number"
                name="cantidad"
                id="cantidad"
                min="1"
                max="99"
                value="1">

        <br></br>
            <label>Forma de pago: </label>
            <br><br>
            <label>Debito: </label>
            <input class="pago" type="radio" name="fdepago" value="debito">
            <label>Credito: </label>
            <input class="pago" type="radio" name="fdepago" value="credito">
            <label>Efectivo: </label>
            <input class="pago" type="radio" name="fdepago" value="efectivo">
        
        <br></br>
            <button class="submit" type="submit">ENVIAR</button>
            </fieldset>
        </form>
    <script src="JS/validaform.js"></script>
</body>
</html>

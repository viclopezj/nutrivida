<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio de Sesión</title>
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="stylesheet" href="CSS/login_style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>

    <body>
        <header id="encabezado">
            <div class="header-brand">
                <i class="fa fa-leaf logo-icono" aria-hidden="true"></i>
                <h1>Nutrivida</h1>
            </div>
            <p class="eslogan">Planea Saludable Para Una Vida Memorable</p>
        </header>

        <nav class="topnav">
            <a href="index.html"><i class="fa fa-fw fa-home"></i> Inicio</a> 
            <a href="productos.html"><i class="fa fa-fw fa-shopping-cart"></i> Catálogo de Compras</a>
			<a href="agendar.html"><i class="fa fa-fw fa-calendar"></i> Agendar Cita</a>
            <!-- CAMBIO: class="split active" en lugar de class="split" active -->
            <a href="login.html" class="split active"><i class="fa fa-fw fa-user"></i> Iniciar Sesión</a>            <span class="carrito-contador"><i class="fa fa-fw fa-shopping-basket"></i> Carrito (<span id="carrito-num">0</span>)</span>
        </nav>

        <main id="contenido">
            <form id="inicio">
                <fieldset>
                    <legend>Iniciar Sesión</legend>

                    <div class="user-brand">
                        <i class="fa fa-user user-icono" aria-hidden="true"></i>
                    </div>

                    <label for="correo">Correo Electrónico:</label>
                    <input class="ini" type="email" name="correo" id="correo" placeholder="usuario@gmail.com" required>

                    <label for="contrasenia">Contraseña:</label>
                    <input class="ini" type="password" name="contrasenia" id="contrasenia" required>

                    <label class="mostrar-pass">
                        <input type="checkbox" onclick="mostrar()"> Mostrar Contraseña
                    </label>

                    <button class="btn-inicio" type="submit">Iniciar Sesión</button>

                    <p class="texto-registro">
                        ¿No tiene cuenta? <a href="registro.html">Regístrese ahora</a>
                    </p>
                </fieldset> 
            </form> 
        </main>

        <footer id="pie">
            <div class="pie-logo">
                <h1>Nutrivida</h1>
                <i class="fa fa-leaf logo-icono" aria-hidden="true"></i>
            </div>
            <p><small>BY NUTRIVIDA CLINICA</small></p>
            <p><small>&copy; 2026 NutriVida - Todos los derechos reservados</small></p>
        </footer>

        <script src="JS/validainicio.js"></script>
    </body>
</html>
